version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: benevoclic-mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: benevoclic
    volumes:
      - mongodb_data:/data/db
    command: mongod --auth

  postgres:
    image: postgres:15-alpine
    container_name: benevoclic-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: benevoclic
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  adminer:
    image: adminer
    container_name: benevoclic-adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  mongodb_data:
    name: mongodb_data
  postgres_data:
    name: postgres_data
